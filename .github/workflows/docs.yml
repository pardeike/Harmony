name: Build and Deploy Documentation

on:
  workflow_dispatch:
  push:
    branches: [ master, v3 ]
    paths:
      - 'Documentation/**'
      - 'Harmony/**'
      - 'Directory.Build.props'
      - 'scripts/generate_llm_pack.py'
      - '.github/workflows/docs.yml'

permissions:
  contents: write

# Both branches publish directories on the same gh-pages branch.
concurrency:
  group: harmony-documentation
  cancel-in-progress: false

env:
  DOCS_VERSION: ${{ github.ref_name == 'v3' && 'v3' || 'v2' }}

jobs:
  build:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/v3'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Install DocFX
        run: dotnet tool install -g docfx --version 2.78.5
      # The API reference reads the net48 build. It has the full public API, while net35 lacks the async members
      # and .NET 5 or later builds add serialization attributes to the syntax blocks.
      - name: Build Library
        run: dotnet build -c Debug -f net48 ./Lib.Harmony/Lib.Harmony.csproj
      - name: Build Documentation
        run: docfx Documentation/docfx.json
      - name: Check documentation links
        run: python Documentation/verify_site.py docs
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Generate LLM Pack
        run: python scripts/generate_llm_pack.py --base-url "https://harmony.pardeike.net/${{ env.DOCS_VERSION }}/"
      # Git on the Windows runner warns that committed LF files would get CRLF on a later checkout. The deploy clone is never checked out again.
      - name: Keep the deploy clone free of line-ending notices
        run: git config --global core.safecrlf false
      - name: Deploy versioned documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ${{ env.DOCS_VERSION }}
          cname: harmony.pardeike.net
