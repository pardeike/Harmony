name: Build and Deploy Documentation

on:
  workflow_dispatch:
  push:
    branches: [ master, v3 ]
    paths:
      - 'Documentation/**'
      - 'Harmony/**'
      - 'Directory.Build.props'
      - 'scripts/generate_llm_pack.py'
      - '.github/workflows/docs.yml'

permissions:
  contents: write

# Both branches publish directories on the same gh-pages branch.
concurrency:
  group: harmony-documentation
  cancel-in-progress: false

env:
  DOCS_VERSION: ${{ github.ref_name == 'v3' && 'v3' || 'v2' }}

jobs:
  build:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/v3'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.0.x
      - name: Install DocFX
        run: dotnet tool install -g docfx
      - name: Build Library
        run: dotnet build -c Debug -f net35 ./Lib.Harmony/Lib.Harmony.csproj
      - name: Build Documentation
        run: docfx Documentation/docfx.json
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Generate LLM Pack
        run: python scripts/generate_llm_pack.py --base-url "https://harmony.pardeike.net/${{ env.DOCS_VERSION }}/"
      - name: Deploy versioned documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ${{ env.DOCS_VERSION }}
          cname: harmony.pardeike.net
