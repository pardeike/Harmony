name: Test Execute Test
description: |
  Execute the tests for the specified operating system, architecture, runtime type, target framework, and build configuration.
  You can use `target_framework` for a single test or `target_framework_array` for multiple tests.

inputs:
  os:
    description: 'The operating system to use'
    required: true
  architecture:
    description: 'The architecture to use'
    required: true
  runtime-type:
    description: 'Values: "dotnet", "mono", "fx"'
    required: true
  target_framework:
    description: 'The target framework to use'
    required: true
  target_framework_array:
    description: 'The target frameworks to use'
    required: true
  build_configuration:
    description: 'The build configuration to use'
    required: true
  manual_build:
    description: 'Whether to build manually before running the tests'
    required: true
  upload_tests:
    description: 'Whether to upload the test results'
    required: true
  experimental:
    description: 'Whether the tests are mandatory for the build to pass'
    required: true

runs:
  using: "composite"
  steps:
    - name: Get Program Files path for ${{inputs.architecture}}
      uses: ./.github/actions/get-program-files
      id: get-program-files
      with:
        architecture: ${{inputs.architecture}}

    - name: Set Test Args
      id: test-args
      run: |
        $run_settings_args = 'NUnit.DefaultTestNamePattern="{C}:{m}{a}" RunConfiguration.TargetPlatform=${{inputs.architecture}}';
        "run_settings_args=$run_settings_args" | Out-File -FilePath $env:GITHUB_OUTPUT -Append;
        
        $target_framework = "${{inputs.target_framework}}";
        $target_frameworks = "${{inputs.target_framework_array}}";
        if ($target_frameworks -eq '') {
          if ([string]::IsNullOrWhiteSpace($target_framework)) { throw 'No target framework selected' }
          $frameworks = @($target_framework)
        } else {
          $frameworks = @(ConvertFrom-Json $target_frameworks)
        }
        $target_frameworks = ConvertTo-Json -InputObject $frameworks -Compress
        "target_frameworks=$target_frameworks" | Out-File -FilePath $env:GITHUB_OUTPUT -Append;
      shell: pwsh

    - name: Clean TestResults (Windows)
      if: runner.os == 'Windows'
      run: |
        if (Test-Path "TestResults") {
          Remove-Item -Path "TestResults" -Recurse -Force
        }
        New-Item -Path "TestResults" -ItemType Directory
      shell: pwsh

    - name: Clean TestResults (Unix)
      if: runner.os != 'Windows'
      run: |
        rm -rf TestResults
        mkdir -p TestResults
      shell: bash

    - name: Build if required
      if: ${{inputs.manual_build == 'true'}}
      run: |
        . ./.github/scripts/Test-Frameworks.ps1
        Invoke-FrameworkChecks -Frameworks (ConvertFrom-Json '${{steps.test-args.outputs.target_frameworks}}') -Operation Build -Action {
          param($target_framework)
          dotnet build HarmonyTests/HarmonyTests.csproj -c ${{inputs.build_configuration}} -f $target_framework
          if ($LASTEXITCODE -ne 0) { throw "dotnet build exited $LASTEXITCODE" }
        }
      shell: pwsh

    - name: Perform Tests Windows FX/Mono
      if: ${{inputs.os == 'windows' && (inputs.runtime-type == 'fx' || inputs.runtime-type == 'mono')}}
      run: |
        . ./.github/scripts/Test-Frameworks.ps1
        $mono = "${{steps.get-program-files.outputs.path}}/Mono/bin/mono.exe"
       
        $vspath = vswhere -latest -property installationPath
        $vstest = join-path $vspath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
        $runSettingsArgs = @(
          'NUnit.DefaultTestNamePattern={C}:{m}{a}'
          'RunConfiguration.TargetPlatform=${{inputs.architecture}}'
        )
        $testTimeout = if ("${{inputs.runtime-type}}" -eq "mono") {
          [TimeSpan]::FromMinutes(3)
        } else {
          [TimeSpan]::FromMinutes(5)
        }

        function Invoke-VSTest($fileName, [string[]]$arguments, $trxPath, $targetFramework) {
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $fileName
          $startInfo.UseShellExecute = $false
          foreach ($argument in $arguments) {
            [void]$startInfo.ArgumentList.Add($argument)
          }

          $process = [System.Diagnostics.Process]::Start($startInfo)
          if (-not $process.WaitForExit([int]$testTimeout.TotalMilliseconds)) {
            if ("${{inputs.runtime-type}}" -eq "mono" -and (Test-TrxSucceeded $trxPath)) {
              Write-Warning "Mono VSTest did not exit after successful $targetFramework test run; terminating the stuck process and continuing."
              try {
                $process.Kill($true)
              } catch {
                $process.Kill()
              }
              $process.WaitForExit()
              return
            }

            try {
              $process.Kill($true)
            } catch {
              $process.Kill()
            }
            $process.WaitForExit()
            throw "Timed out after $($testTimeout.TotalMinutes) minutes waiting for $targetFramework tests."
          }

          if ($process.ExitCode -ne 0) {
            throw "VSTest exited $($process.ExitCode) for $targetFramework"
          }
        }
    
        Invoke-FrameworkChecks -Frameworks (ConvertFrom-Json '${{steps.test-args.outputs.target_frameworks}}') -ResultPrefix '${{inputs.os}}-${{inputs.architecture}}-${{inputs.runtime-type}}-${{inputs.build_configuration}}' -Action {
          param($target_framework)
          $trxFileName = "${{inputs.os}}-${{inputs.architecture}}-${{inputs.runtime-type}}-${{inputs.build_configuration}}-$target_framework.trx"
          $trxPath = Join-Path "TestResults" $trxFileName
          $testCommand = $vstest
          $testArguments = @(
            "HarmonyTests/bin/${{inputs.build_configuration}}/$target_framework/HarmonyTests.dll"
            "--framework:$target_framework"
            "--logger:trx;LogFileName=../TestResults/$trxFileName"
            "--logger:console;verbosity=normal"
            "--blame"
          )
          $testArguments += "--"
          $testArguments += $runSettingsArgs
          if ("${{inputs.runtime-type}}" -eq "mono") {
            $testCommand = $mono
            $testArguments = @($vstest) + $testArguments
          }
          Invoke-VSTest -fileName $testCommand -arguments $testArguments -trxPath $trxPath -targetFramework $target_framework
        }
      shell: pwsh
      
    - name: Perform Tests Windows .NET | Ubuntu .NET/Mono
      if: ${{(inputs.os == 'windows' && inputs.runtime-type == 'dotnet') || inputs.os == 'ubuntu'}}
      run: |
        . ./.github/scripts/Test-Frameworks.ps1
        Invoke-FrameworkChecks -Frameworks (ConvertFrom-Json '${{steps.test-args.outputs.target_frameworks}}') -ResultPrefix '${{inputs.os}}-${{inputs.architecture}}-${{inputs.runtime-type}}-${{inputs.build_configuration}}' -Action {
          param($target_framework)
          $trxFileName = "${{inputs.os}}-${{inputs.architecture}}-${{inputs.runtime-type}}-${{inputs.build_configuration}}-$target_framework.trx"
          dotnet test "HarmonyTests/bin/${{inputs.build_configuration}}/$target_framework/HarmonyTests.dll" -f $target_framework --logger:"trx;LogFileName=../TestResults/$trxFileName" --logger:"console;verbosity=normal" -- ${{steps.test-args.outputs.run_settings_args}}
          if ($LASTEXITCODE -ne 0) { throw "dotnet test exited $LASTEXITCODE" }
        }
      shell: pwsh

    - name: Perform Tests MacOS/MacOS-arm64 .NET/Mono
      uses: nick-fields/retry@v4
      if: ${{inputs.os == 'macos' || inputs.os == 'macos-arm64'}}
      with:
        timeout_minutes: 45
        max_attempts: 3
        retry_on: timeout
        command: |
          . ./.github/scripts/Test-Frameworks.ps1
          $dotnetCandidates = @()
          if ('${{inputs.os == 'macos-arm64' && inputs.architecture == 'x64' && inputs.runtime-type == 'dotnet'}}' -eq 'true') {
            $dotnetCandidates += '/Users/runner/.dotnet/x64/dotnet'
          }

          if ($env:DOTNET_ROOT) {
            $dotnetCandidates += (Join-Path $env:DOTNET_ROOT 'dotnet')
          }

          $dotnetCandidates += '/Users/runner/.dotnet/dotnet'
          $dotnetCandidates += 'dotnet'

          $dotnet = $null
          foreach ($candidate in $dotnetCandidates) {
            if ($candidate -eq 'dotnet' -or (Test-Path $candidate)) {
              $dotnet = $candidate
              break
            }
          }

          if (-not $dotnet) {
            throw 'Unable to locate a dotnet executable.'
          }
          Invoke-FrameworkChecks -Frameworks (ConvertFrom-Json '${{steps.test-args.outputs.target_frameworks}}') -ResultPrefix '${{inputs.os}}-${{inputs.architecture}}-${{inputs.runtime-type}}-${{inputs.build_configuration}}' -Action {
            param($target_framework)
            $trxFileName = "${{inputs.os}}-${{inputs.architecture}}-${{inputs.runtime-type}}-${{inputs.build_configuration}}-$target_framework.trx"
            & $dotnet test "HarmonyTests/bin/${{inputs.build_configuration}}/$target_framework/HarmonyTests.dll" -f $target_framework --logger:"trx;LogFileName=../TestResults/$trxFileName" --logger:"console;verbosity=normal" -- ${{steps.test-args.outputs.run_settings_args}}
            if ($LASTEXITCODE -ne 0) { throw "dotnet test exited $LASTEXITCODE" }
          }
        shell: pwsh

    - name: Upload Test Result
      uses: ./.github/actions/test-upload-result
      if: ${{(inputs.upload_tests == 'true') && (always() || failure())}}
      with:
        os: ${{inputs.os}}
        architecture: ${{inputs.architecture}}
        runtime-type: ${{inputs.runtime-type}}
        target_framework: ${{inputs.target_framework}}
        build_configuration: ${{inputs.build_configuration}}
        experimental: ${{inputs.experimental == 'true'}}
