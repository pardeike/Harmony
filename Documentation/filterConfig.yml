apiRules:
- exclude:
    uidRegex: ^System\.
    type: Type
- exclude:
    uidRegex: ^HarmonyLib\.Code\.
    type: Type
- include:
    uidRegex: ^HarmonyLib\.Harmony\.(PatchAll|PatchAllUncategorized|PatchCategory|UnpatchCategory)(\(|$)
    type: Method
- exclude:
    hasAttribute:
      uid: System.ObsoleteAttribute
